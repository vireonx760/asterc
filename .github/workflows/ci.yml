name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install LLVM toolchain (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 lld-18
          for tool in clang llvm-objcopy llvm-readobj llvm-objdump llvm-nm ld.lld; do
            "/usr/lib/llvm-18/bin/$tool" --version
          done
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install unicorn==2.1.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure, build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $VsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $VsPath = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $VsPath) { throw 'Visual Studio C++ toolchain was not found' }
            . "$VsPath/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          }
          $Python = (Get-Command python).Source
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DBUILD_TESTING=ON -DASTERASM_WARNINGS_AS_ERRORS=ON -DASTERASM_BUILD_OBJECT_WRITER=ON -DASTERASM_REQUIRE_UNICORN=ON "-DPython3_EXECUTABLE=$Python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/ci --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/ci --output-on-failure --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Guide examples and boot-image build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Compiler = if ($IsWindows) { 'build/ci/asterc.exe' } else { 'build/ci/asterc' }
          python tools/check_examples.py --compiler $Compiler --runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python examples/minikernel/build.py --compiler $Compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
